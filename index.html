    <script>
        function logProbabilidade(texto){
            if(!window.temp_log)
                window.temp_log = '';

            window.temp_log += `<h3>${texto}</h3>`            
        }

        function log_d_separacao(x, y, d_separador){
            let id =  `_${new Date().getTime() + parseInt(100 * Math.random())}`;
            
            let container_log = $(
                `<div class="accordion-item">
                    <h2 class="accordion-header" id="">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#${id}" aria-expanded="false" aria-controls="flush-collapseOne">
                            Accordion Item #1
                        </button>
                    </h2>
                    <div id="${id}" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                        <div class="accordion-body">Placeholder content for this accordion, which is intended to demonstrate the <code>.accordion-flush</code> class. This is the first item's accordion body.</div>
                    </div>
                </div>
            `);

            escreverIndependencia( $(container_log).find('.accordion-button')[0], x, y, d_separador)
            $(container_log).find('.accordion-body').html(window.temp_log);
            window.temp_log = '';

            $("#log").append(container_log);
        }

        function escreverIndependencia(elemento, a, b, condicao) {
            //const elemento = document.querySelector(seletor);
            //if (!elemento) return;

            let formula = !condicao ? 
                "\\( \\nexists S \\quad ("+ a +" \\perp\\!\\!\\!\\perp "+ b +" \\mid S) \\)" : 
                "\\(" + a + " \\perp\\!\\!\\!\\perp " + b + " \\mid " + (condicao.length == 0 ? 'Ω' : condicao) + "\\)";

            // Injeta o texto puro no elemento
            elemento.innerHTML = formula;

            // Força o MathJax a processar o novo conteúdo do elemento
            window.MathJax.typesetPromise([elemento]).catch(function (err) {
                console.error("Erro ao renderizar MathJax:", err.message);
            });
        }
    </script>

<script>
    function carregarJson(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {
            try {
                window.json_distribuicao = JSON.parse(e.target.result);
            } catch (error) {
                alert(error);
            }
        };

        reader.readAsText(file);
    }

    function configurar_exemplos(){

    function configurar_tabela_conjunta(){
        $(".tela").css("display", "none");
        $("#distribuicao").css("display", "block");

        let tbody = $('#tabela_distribuicao > tbody');

        const colunas = Object.keys(distribuicao[0].ocorrencia);

        thead.html('');

        for(let coluna of ['qnt', ...colunas]){
            thead.append(`<th>${coluna}</th>`);
        }

        tbody.html('');

        for(let registro of distribuicao){
            let tr = $(`<tr></tr>`)

            tr.append(`<td>${registro.qnt}</td>`)

            for(let coluna of colunas){
                tr.append(`<td>${registro.ocorrencia[coluna]}</td>`)
            }

            tbody.append(tr);
        }
    }

    function selecionar_relacao(i){

        gerar_distribuicao_conjunta(relacoes[i]);
